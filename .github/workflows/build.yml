name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --no-deps -- -D warnings

  build:
    name: Build (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: handy-groq-linux-amd64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: handy-groq-linux-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: handy-groq-macos-x64
          - os: macos-14-large
            target: aarch64-apple-darwin
            artifact: handy-groq-macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: handy-groq-windows-x64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-shape0-dev libxcb1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 \
            pkg-config libssl-dev
      - name: Build (release)
        run: |
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/handy-groq* dist/ 2>/dev/null || cp target/release/handy-groq* dist/
          cd dist
          zip -r ../artifact.zip *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact.zip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-shape0-dev libxcb1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 \
            pkg-config libssl-dev
      - name: Run tests
        run: cargo test -- --nocapture
